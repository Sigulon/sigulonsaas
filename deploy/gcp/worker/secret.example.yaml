# Copy this file outside the repository, replace every value, then apply it:
#   kubectl apply -f worker-secrets.yaml
# A Kubernetes Secret is required because the worker and KEDA both need Redis
# credentials. Keep the canonical copies in Secret Manager and rotate this
# synced secret when they change.
apiVersion: v1
kind: Secret
metadata:
  name: sigulon-worker-secrets
  namespace: sigulon
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://USER:PASSWORD@HOST/sigulon?retryWrites=true&w=majority"
  REDIS_URL: "redis://:PASSWORD@10.0.0.10:6379/0"
  ENCRYPTION_SECRET: "replace-with-the-same-32-plus-character-web-secret"
  PLIVO_AUTH_ID: ""
  PLIVO_AUTH_TOKEN: ""
  # Service-to-service auth for control-plane callbacks (reserve/finalize).
  # Must match the web + runtime INTERNAL_API_SECRET (Secret Manager:
  # sigulon-internal-api-secret). Empty = worker cannot call them.
  INTERNAL_API_SECRET: ""
  # Optional: only needed if the worker ever calls AI providers directly.
  # Canonical copies live in Secret Manager (sigulon-cartesia-api-key,
  # sigulon-openrouter-api-key); leave empty unless required.
  CARTESIA_API_KEY: ""
  OPENROUTER_API_KEY: ""
  # host:port only; no redis:// scheme. These values are used by KEDA.
  KEDA_REDIS_ADDRESS: "10.0.0.10:6379"
  KEDA_REDIS_PASSWORD: "PASSWORD"
