apiVersion: v1
kind: ConfigMap
metadata:
  name: sigulon-worker-config
  namespace: sigulon
data:
  MONGODB_DATABASE: sigulon
  PUBLIC_WEB_URL: __WEB_URL__
  WORKER_POLL_TIMEOUT_SECONDS: "5"
  WORKER_RETRY_BATCH_SIZE: "50"
  WORKER_SWEEP_INTERVAL_SECONDS: "120"
  WORKER_STALE_AFTER_SECONDS: "900"
  WORKER_MAX_CALL_ATTEMPTS: "3"
  WORKER_RETRY_BASE_SECONDS: "300"
  WORKER_GLOBAL_MAX_CONCURRENT: "50"
  WORKER_CAMPAIGN_MAX_CONCURRENT: "5"
  WORKER_NUMBER_MAX_CONCURRENT: "2"
  WORKER_DIAL_TIMEOUT_SECONDS: "15"
