# The worker stays on GKE because it is a continuous, non-HTTP Redis consumer.
# KEDA owns the replica count; do not add an HPA to this deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigulon-campaign-worker
  namespace: sigulon
  labels:
    app.kubernetes.io/name: sigulon-campaign-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sigulon-campaign-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sigulon-campaign-worker
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: __WORKER_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: sigulon-worker-config
          env:
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: sigulon-worker-secrets, key: MONGODB_URI } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: sigulon-worker-secrets, key: REDIS_URL } }
            - name: ENCRYPTION_SECRET
              valueFrom: { secretKeyRef: { name: sigulon-worker-secrets, key: ENCRYPTION_SECRET } }
            - name: PLIVO_AUTH_ID
              valueFrom: { secretKeyRef: { name: sigulon-worker-secrets, key: PLIVO_AUTH_ID } }
            - name: PLIVO_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: sigulon-worker-secrets, key: PLIVO_AUTH_TOKEN } }
            # KEDA reads these from the scale target's environment. This keeps
            # the Redis endpoint and password out of the ScaledObject.
            - name: KEDA_REDIS_ADDRESS
              valueFrom: { secretKeyRef: { name: sigulon-worker-secrets, key: KEDA_REDIS_ADDRESS } }
            - name: KEDA_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: sigulon-worker-secrets, key: KEDA_REDIS_PASSWORD } }
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
