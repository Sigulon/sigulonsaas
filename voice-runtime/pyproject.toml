[project]
name = "voice-runtime"
version = "1.0.0"
description = "Sigulon multi-tenant voice runtime: LiveKit Agents 1.x + LiveKit Inference + Cartesia TTS + SIP telephony"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.0.0",
    "livekit-api>=1.0.0",
    "livekit-plugins-silero>=0.0.1",
    "livekit-plugins-turn-detector>=0.0.1",
    "livekit-plugins-cartesia>=0.0.1",
    "livekit-plugins-deepgram>=0.0.1",
    "livekit-plugins-openai>=0.0.1",
    "redis==8.1.0",
    "pymongo==4.18.1",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "python-dotenv==1.2.3",
]
