# Sigulon CI — lint, types, unit tests, build, and container images.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - working-directory: voice-runtime
        run: uv sync --frozen
      - working-directory: voice-runtime
        run: uvx ruff check . || echo "ruff not yet enforced (TODO: make blocking)"
      - working-directory: voice-runtime
        run: uv run python -m unittest discover -s tests

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - working-directory: services/campaign-worker
        run: uv sync --frozen
      - working-directory: services/campaign-worker
        run: uvx ruff check . || echo "ruff not yet enforced (TODO: make blocking)"
      - working-directory: services/campaign-worker
        run: uv run python -m unittest discover -s tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [runtime, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile -t sigulon-web:ci .
      - run: docker build -f voice-runtime/Dockerfile -t sigulon-runtime:ci ./voice-runtime
      - run: docker build -f services/campaign-worker/Dockerfile -t sigulon-worker:ci ./services/campaign-worker
